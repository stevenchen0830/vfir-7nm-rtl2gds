<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1450" height="660" fill="#ffffff"/>

  <!-- ================= control plane lane ================= -->
  <rect x="30" y="35" width="1120" height="170" rx="10" fill="#EDF2FB" stroke="#8FA8CE" stroke-width="1.5"/>
  <text x="52" y="66" font-size="15" font-weight="bold" fill="#3A5A8C" letter-spacing="1">CONTROL PLANE &#8212; evaluated once per output row</text>

  <g stroke="#3A5A8C" stroke-width="2" fill="#ffffff">
    <rect x="55"  y="92" width="150" height="70" rx="6"/>
    <rect x="245" y="92" width="210" height="70" rx="6"/>
    <rect x="495" y="92" width="180" height="70" rx="6"/>
    <rect x="705" y="92" width="22"  height="70" fill="#3A5A8C"/>
    <rect x="757" y="92" width="210" height="70" rx="6"/>
    <rect x="997" y="92" width="140" height="70" rx="6"/>
  </g>
  <g font-size="16" fill="#1c2733" text-anchor="middle">
    <text x="130" y="120" font-weight="bold">Frame config</text>
    <text x="130" y="142" font-size="13.5">W&#8722;1, H&#8722;1, blk_v, coef</text>
    <text x="350" y="113" font-weight="bold">PREP mirror params</text>
    <text x="350" y="133" font-size="13.5">(2H+23) mod 49</text>
    <text x="350" y="151" font-size="13.5">8-cycle serial subtraction</text>
    <text x="585" y="120" font-weight="bold">Rotator stage A</text>
    <text x="585" y="142" font-size="13.5">fine rotate +1 / +2 / +4</text>
    <text x="862" y="120" font-weight="bold">Rotator stage B</text>
    <text x="862" y="142" font-size="13.5">+8 / +16 / +32, 3-way sum</text>
    <text x="1067" y="113" font-weight="bold">Weights C</text>
    <text x="1067" y="133" font-size="13.5">392 b</text>
    <text x="1067" y="151" font-size="13.5">c_fut &#8594; c_cur</text>
  </g>
  <text x="716" y="84" font-size="12.5" fill="#3A5A8C" text-anchor="middle">1,193 b</text>
  <text x="716" y="185" font-size="12.5" fill="#3A5A8C" text-anchor="middle">pipe reg</text>

  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="205" y1="127" x2="243" y2="127"/>
    <line x1="455" y1="127" x2="493" y2="127"/>
    <line x1="675" y1="127" x2="703" y2="127"/>
    <line x1="727" y1="127" x2="755" y2="127"/>
    <line x1="967" y1="127" x2="995" y2="127"/>
  </g>

  <!-- ================= datapath lane label ================= -->
  <text x="52" y="232" font-size="15" font-weight="bold" fill="#666" letter-spacing="1">DATAPATH &#8212; every beat (4 pixels / cycle)</text>

  <!-- datapath boxes -->
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <rect x="55"  y="250" width="150" height="56" rx="6"/>
    <rect x="255" y="250" width="170" height="56" rx="6"/>
    <rect x="680" y="250" width="210" height="56" rx="6"/>
  </g>
  <rect x="350" y="380" width="280" height="120" rx="10" fill="#FDF3E3" stroke="#B07A2A" stroke-width="2"/>
  <rect x="690" y="400" width="130" height="80" rx="6" fill="#ffffff" stroke="#333" stroke-width="2"/>
  <g stroke="#2F7D46" stroke-width="2" fill="#EAF5EC">
    <rect x="870"  y="400" width="170" height="80" rx="6"/>
    <rect x="1090" y="400" width="140" height="80" rx="6"/>
    <rect x="1280" y="400" width="140" height="80" rx="6"/>
  </g>
  <g stroke="#333" stroke-width="2" fill="#ffffff">
    <rect x="1090" y="560" width="170" height="56" rx="6"/>
    <rect x="830"  y="560" width="170" height="56" rx="6"/>
  </g>

  <g font-size="16" fill="#1c2733" text-anchor="middle">
    <text x="130" y="273" font-weight="bold">Input stream</text>
    <text x="130" y="295" font-size="13.5">160 b / beat</text>
    <text x="340" y="283" font-weight="bold">2-slot input FIFO</text>
    <text x="785" y="273" font-weight="bold">Bypass tap</text>
    <text x="785" y="295" font-size="13.5">row streaming in, 160 b</text>
    <text x="490" y="415" font-weight="bold">49 &#215; single-port SRAM</text>
    <text x="490" y="440" font-size="13.5">160 b &#215; 1440 each</text>
    <text x="490" y="462" font-size="13.5">48 reads + 1 write / beat</text>
    <text x="755" y="433" font-weight="bold">rdata_q</text>
    <text x="755" y="457" font-size="13.5">7,840 b</text>
    <text x="955" y="426" font-weight="bold">MAC-1</text>
    <text x="955" y="448" font-size="13.5">25 mul-add pairs</text>
    <text x="955" y="466" font-size="13.5">&#215; 16 lanes</text>
    <text x="1160" y="433" font-weight="bold">MAC-2</text>
    <text x="1160" y="457" font-size="13.5">5 partial sums</text>
    <text x="1350" y="426" font-weight="bold">MAC-3</text>
    <text x="1350" y="448" font-size="13.5">sum + round</text>
    <text x="1350" y="466" font-size="13.5">+ saturate</text>
    <text x="1175" y="583" font-weight="bold">2-slot output skid</text>
    <text x="915" y="583" font-weight="bold">Output stream</text>
    <text x="915" y="605" font-size="13.5">160 b / beat</text>
  </g>

  <!-- datapath arrows -->
  <g stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line x1="205" y1="278" x2="253" y2="278"/>
    <line x1="425" y1="278" x2="678" y2="278"/>
    <polyline points="890,278 955,278 955,398"/>
    <polyline points="340,306 340,430 348,430"/>
    <line x1="630" y1="440" x2="688" y2="440"/>
    <line x1="820" y1="440" x2="868" y2="440"/>
    <line x1="1040" y1="440" x2="1088" y2="440"/>
    <line x1="1230" y1="440" x2="1278" y2="440"/>
    <polyline points="1350,480 1350,588 1262,588"/>
    <line x1="1090" y1="588" x2="1002" y2="588"/>
    <polyline points="1030,162 1030,345 560,345 560,378"/>
    <polyline points="1100,162 1100,370 985,370 985,398"/>
  </g>

  <!-- arrow labels -->
  <g font-size="13" fill="#555">
    <text x="540" y="270" text-anchor="middle">current row</text>
    <text x="352" y="352" text-anchor="start">1 bank write</text>
    <text x="795" y="338" text-anchor="middle">read enables (C[j] &#8800; 0) + broadcast address</text>
    <text x="1112" y="250" text-anchor="start">weights, 392 b</text>
    <text x="659" y="432" text-anchor="middle" font-size="12.5">48&#215;160 b</text>
  </g>
</svg>
